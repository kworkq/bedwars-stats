<!DOCTYPE html>
<html>
<head>
    <title>BedWars Stats</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>BedWars Stats</h1>

    <p>
        Wins:
        <input id="wins" type="number" placeholder="100">
    </p>

    <p>
        Kills:
        <input id="kills" type="number" placeholder="500">
    </p>

    <p>
        Beds:
        <input id="beds" type="number" placeholder="80">
    </p>

    <p>
        Final Kills:
        <input id="finalKills" type="number" placeholder="300">
    </p>

    <p>
        Final Deaths:
        <input id="finalDeaths" type="number" placeholder="100">
    </p>

    <p>
        Games:
        <input id="games" type="number" placeholder="200">
    </p>

    <button onclick="calculate()">Calculate</button>

    <h2>Results</h2>

    <p id="result">Enter your stats and press Calculate.</p>

    <script src="script.js"></script>

</body>
</html>
