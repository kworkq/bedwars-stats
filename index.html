<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BedWars Stats</title>
    <meta name="description" content="Check Hypixel BedWars player statistics.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>BedWars Stats</h1>
        <p>Check Hypixel BedWars player statistics</p>
    </header>

    <main>

        <div class="search-box">
            <input
                type="text"
                id="playerInput"
                placeholder="Enter Minecraft username..."
                maxlength="16"
            >

            <button onclick="searchPlayer()">
                Search
            </button>
        </div>

        <div id="result"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
